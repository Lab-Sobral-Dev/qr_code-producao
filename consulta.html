<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src https://deierwldemkevanfxrwg.supabase.co; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Consulta de Alcool 70%</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell view-only-shell">
      <section class="public-view" aria-live="polite">
        <div class="public-card">
          <p class="eyebrow">Verificacao do frasco</p>
          <h2 id="publicTag">Carregando...</h2>
          <dl class="details-grid">
            <div>
              <dt>Setor</dt>
              <dd id="publicAddress">-</dd>
            </div>
            <div>
              <dt>Area</dt>
              <dd id="publicArea">-</dd>
            </div>
            <div>
              <dt>Responsavel</dt>
              <dd id="publicOwner">-</dd>
            </div>
            <div>
              <dt>Nome da solucao atual</dt>
              <dd id="publicSolution">-</dd>
            </div>
            <div>
              <dt>Data do preparo</dt>
              <dd id="publicPreparation">-</dd>
            </div>
            <div>
              <dt>Data de validade</dt>
              <dd id="publicExpiration">-</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd id="publicStatus">-</dd>
            </div>
            <div>
              <dt>Codigo do preparo (logbook)</dt>
              <dd id="publicPrepCode">-</dd>
            </div>
          </dl>
          <p class="notes" id="publicNotes"></p>
        </div>
      </section>
    </main>

    <script src="consulta.js"></script>
  </body>
</html>
